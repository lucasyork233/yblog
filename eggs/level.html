<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Level</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #fef2f2 0%, #ffffff 100%);
      background-attachment: fixed;
      padding: 10px 0 0;
    }

    .container {
      width: 100%;
      max-width: 1000px;
      padding: 0 12px;
      box-sizing: border-box;
    }

    .back-link {
      font-size: 0.85rem;
      color: #9ca3af;
      cursor: pointer;
      text-transform: lowercase;
      letter-spacing: 1px;
      transition: color 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      user-select: none;
      text-decoration: none;
    }

    .back-link:hover {
      color: #ef4444;
    }

    /* Editable title */
    #title {
      text-align: center;
      font-size: 40px;
      font-weight: bold;
      color: #333;
      margin: 0 0 12px;
      padding: 8px 16px;
      cursor: text;
      outline: none;
      border: 1px solid transparent;
      border-radius: 6px;
      transition: border-color 0.2s;
    }

    #title:hover {
      border-color: #ddd;
    }

    #title:focus {
      border-color: #999;
    }

    /* Table wrapper */
    .table-wrapper {
      border: 1px solid #ccc;
      position: relative;
    }

    .table-wrapper::before {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(#D92B2B, #D92B2B) 0 0 / 20px 3px no-repeat,
        linear-gradient(#D92B2B, #D92B2B) 0 0 / 3px 20px no-repeat,
        linear-gradient(#D92B2B, #D92B2B) 100% 0 / 20px 3px no-repeat,
        linear-gradient(#D92B2B, #D92B2B) 100% 0 / 3px 20px no-repeat,
        linear-gradient(#D92B2B, #D92B2B) 0 100% / 20px 3px no-repeat,
        linear-gradient(#D92B2B, #D92B2B) 0 100% / 3px 20px no-repeat,
        linear-gradient(#D92B2B, #D92B2B) 100% 100% / 20px 3px no-repeat,
        linear-gradient(#D92B2B, #D92B2B) 100% 100% / 3px 20px no-repeat;
    }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
    }

    th, td {
      height: 120px;
      vertical-align: middle;
      text-align: left;
      border-bottom: 1px solid #ccc;
    }

    th {
      text-align: center;
    }

    th {
      font-size: 40px;
      color: #2c3e50;
      width: 150px;
      border-right: 1px solid #ccc;
    }

    tr:last-child th,
    tr:last-child td {
      border-bottom: none;
    }

    td {
      width: 850px;
      position: relative;
      padding: 0 16px;
    }

    /* AT Field - drop target highlight */
    td.drag-over {
      outline: none;
      animation: atfield-pulse 0.6s ease-in-out infinite alternate;
    }

    @keyframes atfield-pulse {
      from {
        box-shadow:
          inset 0 0 10px rgba(232, 155, 44, 0.15),
          inset 0 0 25px rgba(232, 155, 44, 0.08);
      }
      to {
        box-shadow:
          inset 0 0 20px rgba(232, 155, 44, 0.35),
          inset 0 0 45px rgba(232, 155, 44, 0.18);
      }
    }

    /* Images inside cells */
    td .cell-image {
      width: 80px;
      height: 80px;
      border-radius: 8px;
      object-fit: cover;
      cursor: grab;
      display: inline-block;
      vertical-align: middle;
      margin: 4px;
    }

    td .cell-image:active {
      cursor: grabbing;
    }

    /* Upload area */
    .upload-area {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 20px;
    }

    .upload-btn, .download-btn {
      padding: 10px 20px;
      background-color: #2c3e50;
      color: #fff;
      font-weight: bold;
      border: 1px solid #4a6274;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: background-color 0.2s;
    }

    .upload-btn:hover {
      background-color: #D92B2B;
      border-color: #D92B2B;
    }

    .download-btn:hover {
      background-color: #6B2FA0;
      border-color: #6B2FA0;
    }

    /* Gallery */
    .gallery {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 16px;
      padding: 16px;
      min-height: 200px;
      border: 1px dashed #fca5a5;
      border-radius: 8px;
      background: linear-gradient(135deg, #fef2f2 0%, #ffffff 100%);
    }

    .gallery .gallery-image {
      width: 80px;
      height: 80px;
      border-radius: 8px;
      object-fit: cover;
      cursor: grab;
      border: 1px solid #ddd;
    }

    .gallery .gallery-image:active {
      cursor: grabbing;
    }

    .gallery.drag-over {
      background-color: rgba(0, 0, 0, 0.04);
      animation: atfield-pulse 0.6s ease-in-out infinite alternate;
    }

    @media (max-width: 640px) {
      body { padding-top: 6px; }

      #title { font-size: 26px; padding: 4px 8px; margin-bottom: 8px; }

      th, td { height: 80px; }
      th { font-size: 20px; width: 72px; }
      td { width: auto; padding: 0 8px; }

      td .cell-image,
      .gallery .gallery-image { width: 52px; height: 52px; }

      .gallery { min-height: 140px; padding: 10px; gap: 8px; }

      .upload-btn, .download-btn { padding: 8px 14px; font-size: 13px; }

      .table-wrapper::before {
        background:
          linear-gradient(#D92B2B, #D92B2B) 0 0 / 12px 2px no-repeat,
          linear-gradient(#D92B2B, #D92B2B) 0 0 / 2px 12px no-repeat,
          linear-gradient(#D92B2B, #D92B2B) 100% 0 / 12px 2px no-repeat,
          linear-gradient(#D92B2B, #D92B2B) 100% 0 / 2px 12px no-repeat,
          linear-gradient(#D92B2B, #D92B2B) 0 100% / 12px 2px no-repeat,
          linear-gradient(#D92B2B, #D92B2B) 0 100% / 2px 12px no-repeat,
          linear-gradient(#D92B2B, #D92B2B) 100% 100% / 12px 2px no-repeat,
          linear-gradient(#D92B2B, #D92B2B) 100% 100% / 2px 12px no-repeat;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 contenteditable="true" id="title">从夯到拉</h1>
    <div class="table-wrapper">
      <table>
        <tr>
          <th class="left-column" style="background-color: #E89B2C;">夯</th>
          <td class="right-column"></td>
        </tr>
        <tr>
          <th class="left-column" style="background-color: #D92B2B; color: #fff;">顶级</th>
          <td class="right-column"></td>
        </tr>
        <tr>
          <th class="left-column" style="background-color: #D98A9B;">人上人</th>
          <td class="right-column"></td>
        </tr>
        <tr>
          <th class="left-column" style="background-color: #6B2FA0; color: #fff;">NPC</th>
          <td class="right-column"></td>
        </tr>
        <tr>
          <th class="left-column" style="background-color: #9EABB3;">拉完了</th>
          <td class="right-column"></td>
        </tr>
      </table>
    </div>
    <div class="gallery" id="gallery"></div>
    <div class="upload-area">
      <button class="upload-btn" id="uploadBtn">装填</button>
      <a href="/" class="back-link">back</a>
      <button class="download-btn" id="downloadBtn">出力</button>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const uploadBtn = document.getElementById('uploadBtn');
      const downloadBtn = document.getElementById('downloadBtn');
      const gallery = document.getElementById('gallery');
      const cells = document.querySelectorAll('.right-column');
      const title = document.getElementById('title');
      let imageCounter = 0;

      title.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          this.blur();
        }
      });

      uploadBtn.addEventListener('click', function () {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        input.multiple = true;
        input.onchange = function () {
          for (const file of input.files) {
            const img = document.createElement('img');
            img.src = URL.createObjectURL(file);
            img.classList.add('gallery-image');
            img.draggable = true;
            img.id = 'img-' + (++imageCounter);

            img.addEventListener('dragstart', function (e) {
              e.dataTransfer.setData('text/plain', this.id);
            });

            gallery.appendChild(img);
          }
        };
        input.click();
      });

      cells.forEach(function (cell) {
        cell.addEventListener('dragover', function (e) {
          e.preventDefault();
          this.classList.add('drag-over');
        });

        cell.addEventListener('dragleave', function () {
          this.classList.remove('drag-over');
        });

        cell.addEventListener('drop', function (e) {
          e.preventDefault();
          this.classList.remove('drag-over');

          const id = e.dataTransfer.getData('text/plain');
          const draggedImg = document.getElementById(id);
          if (!draggedImg) return;
          if (draggedImg.parentElement === this) return;

          draggedImg.classList.remove('gallery-image');
          draggedImg.classList.add('cell-image');
          this.appendChild(draggedImg);
        });
      });

      gallery.addEventListener('dragover', function (e) {
        e.preventDefault();
        this.classList.add('drag-over');
      });

      gallery.addEventListener('dragleave', function () {
        this.classList.remove('drag-over');
      });

      gallery.addEventListener('drop', function (e) {
        e.preventDefault();
        this.classList.remove('drag-over');

        const id = e.dataTransfer.getData('text/plain');
        const draggedImg = document.getElementById(id);
        if (!draggedImg) return;
        if (draggedImg.parentElement === this) return;

        if (draggedImg.classList.contains('cell-image')) {
          draggedImg.classList.remove('cell-image');
          draggedImg.classList.add('gallery-image');
          this.appendChild(draggedImg);
        }
      });

      document.querySelector('table').addEventListener('dblclick', function (e) {
        if (e.target.tagName === 'IMG' && e.target.classList.contains('cell-image')) {
          e.target.classList.remove('cell-image');
          e.target.classList.add('gallery-image');
          gallery.appendChild(e.target);
        }
      });

      downloadBtn.addEventListener('click', function () {
        const imgElements = document.querySelectorAll('.cell-image');
        const loadPromises = [];

        imgElements.forEach(function (img) {
          if (!img.complete || img.naturalWidth === 0) {
            loadPromises.push(new Promise(function (resolve) {
              img.onload = resolve;
              img.onerror = resolve;
            }));
          }
        });

        Promise.all(loadPromises).then(function () {
          var canvas = document.createElement('canvas');
          var ctx = canvas.getContext('2d');
          canvas.width = 1000;

          var rowHeight = 120;
          var totalHeight = 5 * rowHeight;
          canvas.height = totalHeight;
          var tableEl = document.querySelector('table');
          var rows = tableEl.querySelectorAll('tr');
          var y = 0;

          rows.forEach(function (row, i) {
            var th = row.querySelector('th');
            var td = row.querySelector('td');
            var bgColor = th.style.backgroundColor;
            var textColor = th.style.color || '#2c3e50';

            ctx.fillStyle = bgColor;
            ctx.fillRect(0, y, 150, rowHeight);

            ctx.fillStyle = textColor;
            ctx.font = 'bold 36px Arial, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(th.textContent, 75, y + rowHeight / 2);

            ctx.fillStyle = '#fff';
            ctx.fillRect(150, y, 850, rowHeight);

            ctx.strokeStyle = '#ccc';
            ctx.lineWidth = 1;
            if (i < rows.length - 1) {
              ctx.beginPath();
              ctx.moveTo(0, y + rowHeight);
              ctx.lineTo(canvas.width, y + rowHeight);
              ctx.stroke();
            }

            ctx.beginPath();
            ctx.moveTo(150, y);
            ctx.lineTo(150, y + rowHeight);
            ctx.stroke();

            var imgs = td.querySelectorAll('img');
            var imgX = 150 + 16;
            var imgY = y + (rowHeight - 80) / 2;
            imgs.forEach(function (img) {
              ctx.drawImage(img, imgX, imgY, 80, 80);
              imgX += 88;
            });

            y += rowHeight;
          });

          ctx.strokeStyle = '#ccc';
          ctx.lineWidth = 1;
          ctx.strokeRect(0, 0, canvas.width, y);

          var link = document.createElement('a');
          link.href = canvas.toDataURL('image/png');
          link.download = (title.textContent || '从夯到拉') + '.png';
          link.click();
        });
      });
    });
  </script>
</body>
</html>
